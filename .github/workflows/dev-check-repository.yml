name: dev-check-repository

on:
  push:
    branches:
      - main
      - master
      - develop
      - dev
      - '*-patched'
      - '*-patched-dev'
    tags: ['*']
  pull_request:
    branches: [main, master, develop, dev]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  frontend:
    name: Build Frontend (pnpm/Vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Get pnpm store directory
        id: pnpm-cache
        working-directory: frontend
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install frontend dependencies
        working-directory: frontend
        env:
          # Les dépendances appointments (@edifice.io / @cgi-learning-hub) sont publiées
          # sur le registre npm public. Les tokens sont fournis (même vides) par sécurité,
          # au cas où un .npmrc devrait être étendu plus tard.
          NODE_AUTH_TOKEN: ${{ secrets.OPENENT_PACKAGES_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          TIPTAP_PRO_TOKEN: ${{ secrets.TIPTAP_PRO_TOKEN }}
        run: pnpm install --no-frozen-lockfile

      - name: Build frontend
        working-directory: frontend
        run: pnpm build

      - name: Upload frontend dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 1

  backend:
    name: Build (Maven)
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: temurin
          cache: maven

      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

      - name: Inject frontend into backend resources
        run: |
          # Reproduit build.sh::copy_frontend_files
          mkdir -p backend/src/main/resources/view \
                   backend/src/main/resources/public/template \
                   backend/src/main/resources/public/img \
                   backend/src/main/resources/public/js
          cp -r frontend/dist/. backend/src/main/resources/
          # Les fichiers HTML buildés (index.html, appointments.html) vont dans view/
          find backend/src/main/resources -maxdepth 1 -name "*.html" \
            -exec mv {} backend/src/main/resources/view/ \;
          # Templates de notification versionnés -> view/notify
          cp -r backend/src/main/resources/view-src/notify/. backend/src/main/resources/view/notify/
          # Assets publics du frontend
          if [ -d frontend/public ]; then
            cp -r frontend/public/. backend/src/main/resources/public/
          fi

      - name: Configure Maven pour GitHub Packages
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << EOF
          <settings>
            <servers>
              <server>
                <id>github</id>
                <username>$GITHUB_ACTOR</username>
                <password>$GITHUB_TOKEN</password>
              </server>
            </servers>
            <profiles>
              <profile>
                <id>github-packages</id>
                <repositories>
                  <repository>
                    <id>github</id>
                    <name>GitHub open-ent Packages</name>
                    <url>https://maven.pkg.github.com/open-ent/entcore-v2</url>
                    <releases><enabled>true</enabled></releases>
                    <snapshots><enabled>true</enabled></snapshots>
                  </repository>
                </repositories>
              </profile>
            </profiles>
            <activeProfiles>
              <activeProfile>github-packages</activeProfile>
            </activeProfiles>
          </settings>
          EOF
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}

      - name: Build fat JAR
        working-directory: backend
        run: mvn clean package -DskipTests -B -DbuildNumber=${GITHUB_SHA::8} -DscmBranch=${GITHUB_REF_NAME}
